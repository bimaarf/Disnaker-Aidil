stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - composer install --no-interaction --prefer-dist --no-suggest
    - php artisan key:generate
    - php artisan migrate --force

test:
  stage: test
  script:
    - # Tambahkan perintah untuk menjalankan pengujian backend Anda

deploy:
  stage: deploy
  script:
    - rsync -avz --exclude='.env' --exclude='storage' . Yz-Course@bimarf.in:/var/www/html/gitlab/
  only:
    - master
